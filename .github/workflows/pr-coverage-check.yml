name: PR Code Coverage Check

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  coverage-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for accurate diff

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install coverage pytest
          
          # Install project dependencies in order of preference
          if [ -f requirements-dev.txt ]; then 
            echo "📦 Installing from requirements-dev.txt"
            pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then 
            echo "📦 Installing from requirements.txt"
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then 
            echo "📦 Installing from pyproject.toml"
            pip install -e .
          else
            echo "⚠️ No requirements file found, installing only coverage and pytest"
          fi
          
          # Install the project in development mode if setup.py exists
          if [ -f setup.py ]; then
            echo "📦 Installing project in development mode"
            pip install -e .
          fi

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v40
        with:
          files: |
            **/*.py
          files_ignore: |
            **/test_*.py
            **/*_test.py
            **/tests/**
            **/test/**
            **/__pycache__/**
            **/.*
            setup.py
            conftest.py

      - name: Run tests and check coverage
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          # Get changed files
          CHANGED_FILES="${{ steps.changed-files.outputs.all_changed_files }}"
          echo "📂 Changed Python files to analyze:"
          for file in $CHANGED_FILES; do
            echo "  - $file"
          done
          echo ""
          
          # Check if any tests exist
          echo "🔍 Looking for test files..."
          if ! find . -name "test_*.py" -o -name "*_test.py" -o -path "*/tests/*" -name "*.py" | grep -q .; then
            echo "⚠️ No test files found. Creating a minimal test to enable coverage analysis..."
            
            # Create a simple test that imports changed files
            cat > test_coverage_check.py << 'EOF'
          """Temporary test for coverage analysis."""
          import sys
          import os
          
          def test_imports():
              """Test that changed files can be imported."""
              # Get changed files from environment
              changed_files = '''$CHANGED_FILES'''.strip().split()
              
              for file_path in changed_files:
                  if file_path.endswith('.py') and os.path.exists(file_path):
                      try:
                          # Simple import test
                          with open(file_path, 'r') as f:
                              content = f.read()
                          
                          # Compile to check syntax
                          compile(content, file_path, 'exec')
                          print(f"✅ {file_path} syntax OK")
                          
                          # Try to execute the file to get coverage
                          exec(compile(content, file_path, 'exec'))
                          
                      except Exception as e:
                          print(f"⚠️ Issue with {file_path}: {e}")
                          # Don't fail, just note the issue
          EOF
            echo "📝 Created test_coverage_check.py"
          fi
          
          echo ""
          echo "🧪 Running pytest to discover tests..."
          python -m pytest --collect-only -q
          
          echo ""
          echo "🚀 Running coverage analysis..."
          
          # Run coverage without config file conflicts
          # Use a minimal approach that just focuses on the changed files
          coverage erase  # Clear any previous coverage data
          
          # Run tests with coverage, then filter results
          coverage run -m pytest -v
          
          echo ""
          echo "📊 Generating coverage report for changed files only..."
          
          # Create a filtered coverage report
          python << EOF
          import coverage
          import json
          import os
          
          # Load coverage data
          cov = coverage.Coverage()
          cov.load()
          
          # Get changed files
          changed_files = '''$CHANGED_FILES'''.strip().split()
          print(f"Analyzing coverage for: {changed_files}")
          
          # Filter coverage data for only changed files
          filtered_data = {}
          total_statements = 0
          total_covered = 0
          total_missing = 0
          
          for filename in changed_files:
              if os.path.exists(filename):
                  try:
                      # Get coverage data for this file
                      analysis = cov.analysis2(filename)
                      statements = analysis[1]  # All statement line numbers
                      missing = analysis[3]     # Missing line numbers
                      covered = len(statements) - len(missing)
                      
                      if len(statements) > 0:
                          coverage_pct = round((covered / len(statements)) * 100, 2)
                          
                          filtered_data[filename] = {
                              'statements': len(statements),
                              'covered': covered,
                              'missing': len(missing),
                              'coverage': coverage_pct,
                              'missing_lines': sorted(missing)
                          }
                          
                          total_statements += len(statements)
                          total_covered += covered
                          total_missing += len(missing)
                          
                          print(f"{filename}: {coverage_pct}% ({covered}/{len(statements)} lines)")
                          if missing:
                              print(f"  Missing lines: {sorted(missing)}")
                      else:
                          print(f"{filename}: No executable statements found")
                          
                  except Exception as e:
                      print(f"Could not analyze {filename}: {e}")
          
          # Calculate overall coverage
          overall_coverage = 0
          if total_statements > 0:
              overall_coverage = round((total_covered / total_statements) * 100, 2)
          
          print(f"\n📊 Overall Coverage: {overall_coverage}% ({total_covered}/{total_statements} lines)")
          
          # Save results for later steps
          results = {
              'files': filtered_data,
              'totals': {
                  'statements': total_statements,
                  'covered': total_covered,
                  'missing': total_missing,
                  'coverage': overall_coverage
              }
          }
          
          os.makedirs('coverage', exist_ok=True)
          with open('coverage/filtered_results.json', 'w') as f:
              json.dump(results, f, indent=2)
          
          print(f"\n💾 Results saved to coverage/filtered_results.json")
          EOF

      - name: Check coverage threshold
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          THRESHOLD=80
          
          if [ ! -f "coverage/filtered_results.json" ]; then
            echo "❌ Coverage results file not found"
            exit 1
          fi
          
          # Install jq for JSON parsing
          sudo apt-get update && sudo apt-get install -y jq bc
          
          # Get coverage data
          COVERAGE=$(jq '.totals.coverage' coverage/filtered_results.json)
          TOTAL_STATEMENTS=$(jq '.totals.statements' coverage/filtered_results.json)
          
          echo "📊 Coverage Analysis Results:"
          echo "Overall Coverage: ${COVERAGE}%"
          echo "Total Statements: ${TOTAL_STATEMENTS}"
          echo "Threshold: ${THRESHOLD}%"
          echo ""
          
          if [ "$TOTAL_STATEMENTS" -eq 0 ]; then
            echo "ℹ️ No executable statements found in changed files - skipping coverage check"
            exit 0
          fi
          
          # Check individual files
          echo "📁 File-by-file coverage:"
          jq -r '.files | to_entries[] | "\(.key): \(.value.coverage)%"' coverage/filtered_results.json
          echo ""
          
          # Check if overall coverage meets threshold
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage (${COVERAGE}%) is below threshold (${THRESHOLD}%)"
            echo ""
            echo "📝 Files below threshold:"
            jq -r '.files | to_entries[] | select(.value.coverage < 80) | "  - \(.key): \(.value.coverage)% (missing lines: \(.value.missing_lines | join(", ")))"' coverage/filtered_results.json
            echo ""
            echo "💡 Add tests to cover the missing lines above."
            exit 1
          else
            echo "✅ Coverage meets the ${THRESHOLD}% threshold!"
          fi

      - name: Comment coverage results on PR
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsFile = 'coverage/filtered_results.json';
            
            if (!fs.existsSync(resultsFile)) {
              console.log('No coverage results file found');
              return;
            }
            
            const results = JSON.parse(fs.readFileSync(resultsFile, 'utf8'));
            const totals = results.totals;
            
            if (totals.statements === 0) {
              const noCodeComment = `
              ## 📊 Python Code Coverage Report
              
              ℹ️ No executable statements found in changed files.
              
              This typically means the changed files contain only:
              - Comments and docstrings
              - Import statements
              - Class/function definitions without executable code
              
              No coverage analysis required.
              `;
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: noCodeComment
              });
              return;
            }
            
            // Generate file details
            let fileDetails = '';
            Object.entries(results.files).forEach(([file, data]) => {
              const status = data.coverage >= 80 ? '✅' : '❌';
              fileDetails += `| ${file} | ${data.coverage}% | ${data.covered}/${data.statements} | ${status} |\n`;
            });
            
            const coverageComment = `
            ## 📊 Python Code Coverage Report
            
            ### Overall Coverage: ${totals.coverage}%
            
            | Metric | Value |
            |--------|-------|
            | **Overall Coverage** | **${totals.coverage}%** |
            | **Threshold** | **80%** |
            | **Status** | **${totals.coverage >= 80 ? '✅ PASS' : '❌ FAIL'}** |
            | Lines Covered | ${totals.covered}/${totals.statements} |
            
            ### File-by-File Coverage
            | File | Coverage | Lines | Status |
            |------|----------|-------|--------|
            ${fileDetails}
            
            ${totals.coverage >= 80 
              ? '🎉 **All coverage thresholds met!** Great job on maintaining high test coverage.' 
              : `⚠️ **Coverage below 80% threshold.** Please add tests for the missing lines shown above.`}
            
            ---
            *Coverage analysis performed on changed files only*
            `;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: coverageComment
            });

      - name: Upload coverage reports
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/

      - name: No changes detected
        if: steps.changed-files.outputs.any_changed != 'true'
        run: |
          echo "ℹ️ No Python file changes detected. Skipping coverage check."
